# docker compose up --build                                   (NVIDIA GPU, needs nvidia-container-toolkit)
# docker compose --profile cpu up --build meeting-transcriber-cpu   (no GPU)
#
# Secrets come from a .env file next to this one (see .env.example).

x-common: &common
  restart: unless-stopped
  ports:
    # localhost only; to reach it from other machines use "8765:8765" AND set MT_PASSWORD
    - "127.0.0.1:${MT_PORT:-8765}:8765"
  volumes:
    - ./data:/app/data
    - ./models:/app/models
    # Live recording from the host's audio (Linux, PulseAudio/PipeWire): uncomment both lines
    # and set PULSE_SERVER below. Replace 1000 with your user id (`id -u`).
    # - /run/user/1000/pulse/native:/run/pulse/native
    # - ~/.config/pulse/cookie:/root/.config/pulse/cookie:ro
  environment:
    HF_TOKEN: ${HF_TOKEN:-}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    MT_PASSWORD: ${MT_PASSWORD:-}
    MT_WHISPER_MODEL: ${MT_WHISPER_MODEL:-large-v3-turbo}
    MT_LIVE_MODEL: ${MT_LIVE_MODEL:-}
    # PULSE_SERVER: unix:/run/pulse/native

services:
  meeting-transcriber:
    <<: *common
    build: .
    image: meeting-transcriber:gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  meeting-transcriber-cpu:
    <<: *common
    profiles: [cpu]
    build:
      context: .
      args:
        BUILD_IMAGE: ubuntu:24.04
        RUNTIME_IMAGE: ubuntu:24.04
        FORCE_CPU: "1"
    image: meeting-transcriber:cpu
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MT_PASSWORD: ${MT_PASSWORD:-}
      MT_FORCE_CPU: "1"
      MT_WHISPER_MODEL: ${MT_WHISPER_MODEL:-large-v3-turbo-q5_0}
      MT_LIVE_MODEL: ${MT_LIVE_MODEL:-small-q5_1}
