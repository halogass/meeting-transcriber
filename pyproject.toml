[project]
name = "meeting-transcriber"
version = "0.1.0"
description = "Local meeting transcription with speaker diarization (whisper.cpp + pyannote.audio)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "numpy>=1.26",
    "soundfile>=0.12",
    "pyannote.audio>=4.0",
    "torch>=2.8",
    "torchaudio>=2.8",
    "python-docx>=1.1",
    "anthropic>=0.70",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
